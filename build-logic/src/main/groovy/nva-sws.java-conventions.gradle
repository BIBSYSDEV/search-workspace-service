plugins {
    id 'nva.java-conventions'
}

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    pmd {
        excludedRules = [
                'AvoidCatchingGenericException',
                'GuardLogStatement',
                'UnitTestContainsTooManyAsserts',
                'UnitTestShouldIncludeAssert'
        ]
    }
    spotless {
        enabled = true
    }
}
